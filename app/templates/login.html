<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>AutoHire — Sign In</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="icon" href="{{ url_for('static', filename='favicon-32.png') }}" sizes="32x32" type="image/png">
    <link rel="icon" href="{{ url_for('static', filename='favicon-16.png') }}" sizes="16x16" type="image/png">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <meta name="description" content="An AI-driven hiring pipeline: publish a role, candidates apply with just a resume, and AI screens, interviews, and evaluates them end to end.">

    <meta property="og:type" content="website">
    <meta property="og:title" content="AutoHire">
    <meta property="og:description" content="An AI-driven hiring pipeline: publish a role, candidates apply with just a resume, and AI screens, interviews, and evaluates them end to end. Sign in with Google and try it yourself — every recruiter gets a private workspace.">
    <meta property="og:image" content="{{ base_url }}/static/og-image.png">
    <meta property="og:image:width" content="1600">
    <meta property="og:image:height" content="1000">
    <meta property="og:url" content="{{ base_url }}/login">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="AutoHire">
    <meta name="twitter:description" content="An AI-driven hiring pipeline: publish a role, candidates apply with just a resume, and AI screens, interviews, and evaluates them end to end.">
    <meta name="twitter:image" content="{{ base_url }}/static/og-image.png">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="wrap" style="max-width: 420px; padding-top: 120px; text-align: center;">
    <h1 style="display: flex; align-items: center; justify-content: center; gap: 10px;">
        <img src="{{ url_for('static', filename='favicon.svg') }}" alt="" width="36" height="36" style="border-radius: 8px;">
        AutoHire
    </h1>
    <p class="subtitle">Sign in to manage your roles and candidates</p>

    <div class="card">
        <div id="g_id_onload"
             data-client_id="{{ google_client_id }}"
             data-callback="handleCredentialResponse">
        </div>
        <div class="g_id_signin"
             data-type="standard"
             data-shape="pill"
             data-theme="outline"
             data-size="large"
             style="display: flex; justify-content: center;">
        </div>
        <div class="error" id="login-error" style="margin-top: 16px;"></div>
    </div>
</div>

<script>
    async function handleCredentialResponse(response) {
        const errorEl = document.getElementById("login-error");
        const res = await fetch("/auth/google", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ credential: response.credential }),
        });
        if (!res.ok) {
            const data = await res.json();
            errorEl.textContent = data.error || "Sign-in failed.";
            return;
        }
        window.location.href = "/";
    }
</script>
</body>
</html>
