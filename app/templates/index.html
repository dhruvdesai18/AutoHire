<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>AutoHire</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="wrap">
    <h1>AutoHire</h1>
    <p class="subtitle">Recruiter dashboard</p>

    <div class="card">
        <h2>Publish a Job</h2>
        <input type="text" id="job-title" placeholder="Job title (e.g. Data Analyst)">
        <textarea id="job-description" placeholder="Paste the job description here..." style="margin-top:8px;"></textarea>
        <button id="btn-publish">Publish</button>
        <div class="result" id="publish-result"></div>
    </div>

    <div class="card">
        <h2>Published Jobs</h2>
        <div id="jobs-list" class="result"></div>
    </div>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
<script>
    function badge(text, kind) {
        return `<span class="badge ${kind}">${text}</span>`;
    }

    const STATUS_META = {
        uploaded: { label: "Uploaded", kind: "st-progress" },
        parsed: { label: "Parsed", kind: "st-progress" },
        screening_passed: { label: "Screening Passed", kind: "st-waiting" },
        rejected: { label: "Rejected", kind: "st-danger" },
        interview_prep_ready: { label: "Prep Ready", kind: "st-waiting" },
        interview_link_sent: { label: "Interview Sent", kind: "st-waiting" },
        interview_audio_uploaded: { label: "Awaiting Evaluation", kind: "st-action" },
        advanced: { label: "Advanced", kind: "st-success" },
        expired: { label: "Expired", kind: "st-danger" },
    };

    function applyUrl(jobId) {
        return `${location.origin}/apply/${jobId}`;
    }

    async function loadJobs() {
        const listEl = document.getElementById("jobs-list");
        listEl.innerHTML = `
            <div class="skeleton-line w-40"></div>
            <div class="skeleton-line w-80"></div>
            <div class="skeleton-line w-60" style="margin-top:20px;"></div>
        `;

        const res = await fetch("/jobs");
        const data = await res.json();

        if (!data.jobs.length) {
            listEl.innerHTML = '<div class="empty-state fade-in">No jobs published yet.</div>';
            return;
        }

        listEl.innerHTML = data.jobs.map((job, i) => `
            <div class="job-row fade-in" style="animation-delay:${i * 0.04}s" data-job-id="${job.job_id}">
                <div class="job-title">${job.title}</div>
                <div><a href="${applyUrl(job.job_id)}" target="_blank">${applyUrl(job.job_id)}</a></div>
                <button class="link-btn view-candidates-btn" data-job-id="${job.job_id}">View Candidates</button>
                <button class="link-btn danger delete-job-btn" data-job-id="${job.job_id}" data-job-title="${job.title}">Delete Job</button>
                <div class="candidates-container" id="candidates-${job.job_id}"></div>
            </div>
        `).join("");

        document.querySelectorAll(".view-candidates-btn").forEach(btn => {
            btn.addEventListener("click", () => loadCandidates(btn.dataset.jobId));
        });

        document.querySelectorAll(".delete-job-btn").forEach(btn => {
            btn.addEventListener("click", () => deleteJob(btn.dataset.jobId, btn.dataset.jobTitle));
        });
    }

    async function deleteJob(jobId, jobTitle) {
        const confirmed = confirm(`Delete "${jobTitle}" and all of its candidates? This cannot be undone.`);
        if (!confirmed) return;

        const res = await fetch(`/jobs/${jobId}`, { method: "DELETE" });
        if (!res.ok) {
            const data = await res.json();
            showToast(data.error || "Failed to delete job.", "error");
            return;
        }
        showToast(`"${jobTitle}" deleted.`, "success");
        loadJobs();
    }

    async function loadCandidates(jobId) {
        const container = document.getElementById(`candidates-${jobId}`);
        container.innerHTML = `
            <div class="skeleton-line w-60" style="margin-top:14px;"></div>
            <div class="skeleton-line w-40"></div>
        `;

        const res = await fetch(`/jobs/${jobId}/candidates`);
        const data = await res.json();

        if (!data.candidates.length) {
            container.innerHTML = '<div class="empty-state fade-in">No applications yet.</div>';
            return;
        }

        container.innerHTML = data.candidates.map((c, i) => {
            const meta = STATUS_META[c.status] || { label: c.status, kind: "st-progress" };
            const scoreLine = [
                c.ats_score != null ? `ATS: ${c.ats_score}` : null,
                c.conversation_score != null ? `Interview: ${c.conversation_score}` : null,
            ].filter(Boolean).join(" · ");
            const metaLine = [c.email, scoreLine].filter(Boolean).join(" · ");

            return `
                <div class="candidate-row fade-in" style="animation-delay:${i * 0.04}s" data-candidate-id="${c.candidate_id}">
                    <div>${c.name || c.filename || c.candidate_id} <span class="status-pill ${meta.kind}">${meta.label}</span> <a class="link-btn inline" href="/candidates/${c.candidate_id}/resume" target="_blank">View Resume</a></div>
                    <div class="meta">${metaLine}</div>
                    ${c.status === "interview_audio_uploaded"
                        ? `<button class="link-btn evaluate-btn" data-candidate-id="${c.candidate_id}">Evaluate</button>
                           <div class="result eval-result" id="eval-${c.candidate_id}"></div>`
                        : ""}
                </div>
            `;
        }).join("");

        container.querySelectorAll(".evaluate-btn").forEach(btn => {
            btn.addEventListener("click", () => evaluateCandidate(btn.dataset.candidateId, jobId));
        });
    }

    async function evaluateCandidate(candidateId, jobId) {
        const resultEl = document.getElementById(`eval-${candidateId}`);
        resultEl.innerHTML = '<div class="spinner">Diarizing and evaluating (this can take a minute)...</div>';

        const res = await fetch(`/evaluate-interview/${candidateId}`, { method: "POST" });
        const data = await res.json();
        if (!res.ok) {
            resultEl.innerHTML = `<div class="error">${data.error}</div>`;
            showToast(data.error || "Evaluation failed.", "error");
            return;
        }

        const advanced = data.status === "advanced";
        resultEl.innerHTML = `
            <div class="fade-in">Score: <strong>${data.conversation_score}</strong>/100 ${badge(advanced ? "ADVANCED" : "REJECTED", advanced ? "pass" : "fail")}</div>
            <div class="fade-in" style="margin-top:6px;">${data.summary}</div>
        `;
        showToast(advanced ? "Candidate advanced!" : "Candidate rejected.", advanced ? "success" : "info");
        loadCandidates(jobId);
    }

    document.getElementById("btn-publish").addEventListener("click", async () => {
        const title = document.getElementById("job-title").value.trim();
        const description = document.getElementById("job-description").value.trim();
        const resultEl = document.getElementById("publish-result");
        if (!title || !description) {
            resultEl.innerHTML = '<div class="error">Enter a title and description first.</div>';
            return;
        }
        resultEl.innerHTML = '<div class="spinner">Publishing...</div>';

        const res = await fetch("/jobs", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ title, description }),
        });
        const data = await res.json();
        if (!res.ok) {
            resultEl.innerHTML = `<div class="error">${data.error}</div>`;
            showToast(data.error || "Failed to publish job.", "error");
            return;
        }

        document.getElementById("job-title").value = "";
        document.getElementById("job-description").value = "";
        resultEl.innerHTML = `<span class="fade-in">Published. Application link: <a href="${applyUrl(data.job_id)}" target="_blank">${applyUrl(data.job_id)}</a></span>`;
        showToast("Job published!", "success");
        loadJobs();
    });

    loadJobs();
</script>
</body>
</html>
