<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>AutoHire</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="icon" href="{{ url_for('static', filename='favicon-32.png') }}" sizes="32x32" type="image/png">
    <link rel="icon" href="{{ url_for('static', filename='favicon-16.png') }}" sizes="16x16" type="image/png">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="app-shell">
    <div class="nav">
        <span class="nav-brand"><img src="{{ url_for('static', filename='favicon.svg') }}" alt="" width="22" height="22"> AutoHire</span>
        <span class="nav-subtitle" style="font-size:12px;color:var(--color-neutral-600);margin-right:auto;">Recruiter workspace · protected</span>
        <span style="font-size:12px;color:var(--color-neutral-600);margin-right:12px;">{{ user_name }}</span>
        <a href="#" id="btn-take-tour" style="font-size:12px;color:var(--color-neutral-600);margin-right:16px;">Take a tour</a>
        <a href="/logout" style="font-size:12px;color:var(--color-neutral-600);margin-right:16px;">Sign out</a>
        <button class="btn btn-secondary" id="btn-open-team-plan" style="margin-right:10px;">Describe a project</button>
        <button class="btn btn-primary" id="btn-open-publish">Publish a role</button>
    </div>

    <div class="dashboard-grid">
        <div class="rail-col">
            <div class="rail-head">
                <span class="kick">Open roles</span>
                <span class="kick num" style="color:var(--color-neutral-600);" id="job-count">—</span>
            </div>
            <div id="roles-list">
                <div style="padding:8px 14px;">
                    <div class="skeleton-line w-80"></div>
                    <div class="skeleton-line w-60"></div>
                </div>
            </div>
            <div style="padding:16px 14px;">
                <button class="btn btn-primary btn-block" id="btn-open-publish-2">Publish a role</button>
            </div>
        </div>

        <div class="main-col" id="main-col">
            <div class="empty-state fade-in" style="padding:60px 0;">Select a role to view candidates.</div>
        </div>

        <div class="dossier-col" id="dossier-col">
            <div class="empty-state fade-in" style="padding:60px 0;">No candidate selected.</div>
        </div>
    </div>
</div>

<div id="publish-modal-mount"></div>
<div id="team-plan-modal-mount"></div>
<div id="welcome-modal-mount"></div>
<div id="tour-overlay-mount"></div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
<script>
    const _origFetch = window.fetch;
    window.fetch = async (...args) => {
        const res = await _origFetch(...args);
        if (res.status === 401) {
            window.location.href = "/login";
        }
        return res;
    };

    const ATS_THRESHOLD = {{ ats_threshold|tojson }};
    const INTERVIEW_THRESHOLD = {{ interview_threshold|tojson }};
    const IS_ADMIN = {{ is_admin|tojson }};
    const CURRENT_USER_EMAIL = {{ user_email|tojson }};

    const STATUS_META = {
        uploaded: { label: "Screening", tag: "tag-neutral" },
        parsed: { label: "Screening", tag: "tag-neutral" },
        screening_passed: { label: "Screening passed", tag: "tag-neutral" },
        interview_prep_ready: { label: "Prep ready", tag: "tag-neutral" },
        interview_link_sent: { label: "Assessment sent", tag: "tag-neutral" },
        interview_audio_uploaded: { label: "Awaiting evaluation", tag: "tag-accent" },
        advanced: { label: "Advanced", tag: "tag-outline" },
        expired: { label: "Expired", tag: "tag-neutral" },
    };

    function statusMeta(c) {
        if (c.status === "rejected") {
            return c.conversation_score != null
                ? { label: "Rejected", tag: "tag-neutral" }
                : { label: "Screened out", tag: "tag-neutral" };
        }
        return STATUS_META[c.status] || { label: c.status, tag: "tag-neutral" };
    }

    let jobs = [];
    let selectedJobId = null;
    let candidates = [];
    let selectedCandidateId = null;

    function applyUrl(jobId) { return `${location.origin}/apply/${jobId}`; }
    function fmtDate(iso) {
        if (!iso) return "";
        const d = new Date(iso);
        if (isNaN(d)) return "";
        return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    }
    function fmtTime(iso) {
        if (!iso) return "";
        const d = new Date(iso);
        if (isNaN(d)) return "";
        return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    }

    // ---------- Roles rail ----------

    async function loadJobs() {
        const res = await fetch("/jobs");
        const data = await res.json();
        jobs = data.jobs;
        document.getElementById("job-count").textContent = jobs.length;

        const listEl = document.getElementById("roles-list");
        if (!jobs.length) {
            listEl.innerHTML = '<div class="empty-state fade-in" style="padding:20px 14px;">No roles yet.<br>Publish your first role below to get a shareable link.</div>';
            renderMainCol();
            renderDossier();
            return;
        }

        listEl.innerHTML = jobs.map((job) => `
            <button class="jrow" aria-current="${job.job_id === selectedJobId}" data-job-id="${job.job_id}">
                <span class="jtitle">${job.title}</span>
                <span class="num" style="font-size:12px;color:var(--color-neutral-600);">${job.applied_count}</span>
                <span class="jsub">${job.advanced_count} advanced${job.created_at ? " · " + fmtDate(job.created_at) : ""}${IS_ADMIN && job.owner_email && job.owner_email !== CURRENT_USER_EMAIL ? " · " + job.owner_email : ""}</span>
            </button>
        `).join("");

        listEl.querySelectorAll(".jrow").forEach((btn) => {
            btn.addEventListener("click", () => selectJob(btn.dataset.jobId));
        });

        if (!selectedJobId || !jobs.find((j) => j.job_id === selectedJobId)) {
            selectedJobId = jobs[0].job_id;
            selectedCandidateId = null;
        }
        await loadCandidates(selectedJobId);
    }

    async function selectJob(jobId) {
        selectedJobId = jobId;
        document.querySelectorAll(".jrow").forEach((btn) => {
            btn.setAttribute("aria-current", String(btn.dataset.jobId === jobId));
        });
        selectedCandidateId = null;
        await loadCandidates(jobId);
    }

    // ---------- Candidate table ----------

    async function loadCandidates(jobId) {
        renderMainCol(true);
        const res = await fetch(`/jobs/${jobId}/candidates`);
        const data = await res.json();
        candidates = data.candidates;
        if (!selectedCandidateId && candidates.length) selectedCandidateId = candidates[0].candidate_id;
        renderMainCol();
        renderDossier();
    }

    function renderMainCol(loading) {
        const col = document.getElementById("main-col");
        const job = jobs.find((j) => j.job_id === selectedJobId);
        if (!job) {
            col.innerHTML = '<div class="empty-state fade-in" style="padding:60px 0;">Select a role to view candidates.</div>';
            return;
        }

        const head = `
            <div class="kick">${job.created_at ? "Posted " + fmtDate(job.created_at) : "Open role"}</div>
            <h2 style="font-size:34px;margin:8px 0 12px;">${job.title}</h2>
            <div style="display:flex;align-items:center;gap:12px;font-size:12px;color:var(--color-neutral-700);border-bottom:1px solid var(--color-divider);padding-bottom:16px;">
                <span style="font-size:11px;letter-spacing:.02em;word-break:break-all;">${applyUrl(job.job_id)}</span>
                <button class="btn btn-ghost" style="font-size:12px;flex:none;" id="btn-copy-link">Copy link</button>
                <button class="btn btn-ghost btn-danger" style="font-size:12px;flex:none;margin-left:auto;" id="btn-delete-job">Delete role</button>
            </div>
            <div class="stats-row">
                <div class="stat"><div class="stat-n num">${job.applied_count}</div><div class="stat-label">Applied</div></div>
                <div class="stat"><div class="stat-n num">${job.screened_out_count}</div><div class="stat-label">Screened out</div></div>
                <div class="stat"><div class="stat-n num">${job.assessed_count}</div><div class="stat-label">Assessed</div></div>
                <div class="stat"><div class="stat-n num">${job.advanced_count}</div><div class="stat-label">Advanced</div></div>
            </div>
        `;

        if (loading) {
            col.innerHTML = head + `
                <div class="skeleton-line w-60"></div>
                <div class="skeleton-line w-80" style="margin-top:14px;"></div>
                <div class="skeleton-line w-40" style="margin-top:14px;"></div>
            `;
            return;
        }

        if (!candidates.length) {
            col.innerHTML = head + '<div class="empty-state fade-in">No applications yet.</div>';
        } else {
            const rows = candidates.map((c) => {
                const meta = statusMeta(c);
                return `
                    <tr class="crow" aria-current="${c.candidate_id === selectedCandidateId}" data-candidate-id="${c.candidate_id}">
                        <td>
                            <div class="cname">${c.name || c.filename || c.candidate_id}</div>
                            <div class="cemail">${c.email || ""}</div>
                        </td>
                        <td><span class="tag ${meta.tag}">${meta.label}</span></td>
                        <td class="num" style="text-align:right;font-size:15px;">${c.ats_score != null ? c.ats_score : "—"}</td>
                        <td class="num" style="text-align:right;font-size:15px;color:var(--color-neutral-600);">
                            ${c.status === "interview_audio_uploaded"
                                ? `<button class="btn btn-primary" style="padding:3px 12px;font-size:12px;margin-top:0;" data-eval-id="${c.candidate_id}">Evaluate</button>`
                                : (c.conversation_score != null ? c.conversation_score : "—")}
                        </td>
                    </tr>
                `;
            }).join("");

            col.innerHTML = head + `
                <div class="table-scroll">
                    <table class="table">
                        <thead><tr><th>Candidate</th><th>Stage</th><th style="text-align:right;">Resume</th><th style="text-align:right;">Assessment</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
                <p style="font-size:11px;color:var(--color-neutral-600);margin-top:14px;">Scores are out of 100. Screening gate ${ATS_THRESHOLD} · assessment gate ${INTERVIEW_THRESHOLD}. Both applied automatically.</p>
            `;
        }

        document.getElementById("btn-delete-job").addEventListener("click", deleteSelectedJob);
        document.getElementById("btn-copy-link").addEventListener("click", () => {
            navigator.clipboard.writeText(applyUrl(job.job_id));
            showToast("Application link copied.", "success");
        });
        col.querySelectorAll(".crow").forEach((row) => {
            row.addEventListener("click", () => {
                selectedCandidateId = row.dataset.candidateId;
                col.querySelectorAll(".crow").forEach((r) => r.setAttribute("aria-current", String(r === row)));
                renderDossier();
            });
        });
        col.querySelectorAll("[data-eval-id]").forEach((btn) => {
            btn.addEventListener("click", (e) => {
                e.stopPropagation();
                const id = btn.dataset.evalId;
                selectedCandidateId = id;
                col.querySelectorAll(".crow").forEach((r) => r.setAttribute("aria-current", String(r.dataset.candidateId === id)));
                renderDossier();
                btn.disabled = true;
                btn.textContent = "Evaluating…";
                evaluateCandidate(id);
            });
        });
    }

    async function deleteSelectedJob() {
        const job = jobs.find((j) => j.job_id === selectedJobId);
        if (!job) return;
        const confirmed = confirm(`Delete "${job.title}" and all of its candidates? This cannot be undone.`);
        if (!confirmed) return;

        const res = await fetch(`/jobs/${job.job_id}`, { method: "DELETE" });
        if (!res.ok) {
            const data = await res.json();
            showToast(data.error || "Failed to delete role.", "error");
            return;
        }
        showToast(`"${job.title}" deleted.`, "success");
        selectedJobId = null;
        candidates = [];
        loadJobs();
    }

    // ---------- Dossier ----------

    function recommendation(c) {
        if (c.status === "advanced") {
            return { title: "Advance to founder interview", why: "Passed both the screening and assessment gates automatically." };
        }
        if (c.status === "interview_audio_uploaded") {
            return { title: "Evaluate the assessment", why: "Answers are recorded and waiting to be scored." };
        }
        if (c.status === "interview_prep_ready" || c.status === "interview_link_sent") {
            return { title: "Wait — assessment open", why: "Candidate has a 24-hour window to complete the recorded assessment." };
        }
        if (c.status === "expired") {
            return { title: "Re-issue the link", why: "The 24-hour assessment window closed before a submission arrived." };
        }
        if (c.status === "rejected") {
            return c.conversation_score != null
                ? { title: "Rejected automatically", why: `Assessment scored ${c.conversation_score}, below the ${INTERVIEW_THRESHOLD} gate.` }
                : { title: "Screened out automatically", why: `Score ${c.ats_score} against the ${ATS_THRESHOLD} gate.` };
        }
        return { title: "Awaiting screening", why: "Resume received; scoring not yet complete." };
    }

    function decisionTrail(c) {
        const steps = [];
        steps.push({ time: fmtTime(c.created_at) || "—", label: "Application received", detail: "Resume uploaded via the public link. Parsed to text.", by: "Automatic" });

        if (c.ats_score != null) {
            const passed = c.ats_score >= ATS_THRESHOLD;
            steps.push({
                time: fmtTime(c.created_at) || "—",
                label: `Screening score ${c.ats_score}`,
                detail: `${passed ? "Above" : "Below"} the ${ATS_THRESHOLD} gate.${passed ? "" : " Pipeline stopped."}`,
                by: "Automatic · Gemini",
            });
        }

        if (c.link_sent_at) {
            steps.push({ time: fmtTime(c.link_sent_at), label: "Shortlist email sent", detail: "Questions written from the resume. 24-hour window opened.", by: "Automatic · Gmail" });
        }

        if (c.status === "expired") {
            steps.push({ time: "—", label: "Link expired", detail: "No recordings received. Status set to expired.", by: "Automatic" });
        }

        if (["interview_audio_uploaded", "advanced"].includes(c.status) || (c.status === "rejected" && c.conversation_score != null)) {
            steps.push({ time: "—", label: "Assessment completed", detail: "Answers recorded and submitted.", by: "Candidate" });
        }

        if (c.conversation_score != null) {
            const passed = c.conversation_score >= INTERVIEW_THRESHOLD;
            steps.push({
                time: "—",
                label: `Assessment score ${c.conversation_score}`,
                detail: `${passed ? "Above" : "Below"} the ${INTERVIEW_THRESHOLD} gate. Status set to ${passed ? "advanced" : "rejected"}.`,
                by: "Automatic · Gemini",
            });
        }

        return steps;
    }

    function skillTags(list, kind) {
        if (!list || !list.length) return `<span class="meta">None recorded.</span>`;
        return list.map((s) => `<span class="tag ${kind}">${s}</span>`).join(" ");
    }

    function renderDossier() {
        const mount = document.getElementById("dossier-col");
        const c = candidates.find((x) => x.candidate_id === selectedCandidateId);
        if (!c) {
            mount.innerHTML = '<div class="empty-state fade-in" style="padding:60px 0;">No candidate selected.</div>';
            return;
        }

        const meta = statusMeta(c);
        const summary = c.interview_summary || c.ats_reasoning || "Not yet available.";
        const rec = recommendation(c);
        const trail = decisionTrail(c);

        mount.innerHTML = `
            <div class="kick fade-in">Profile</div>
            <h3 style="font-size:27px;font-weight:400;margin:8px 0 4px;" class="fade-in">${c.name || c.filename || c.candidate_id}</h3>
            <div style="font-size:12px;color:var(--color-neutral-600);" class="fade-in">${c.email || ""} · <a href="/candidates/${c.candidate_id}/resume" target="_blank">View resume</a></div>

            <div class="dossier-scores fade-in">
                <div class="score-block">
                    <div class="score-n num">${c.ats_score != null ? c.ats_score : "—"}</div>
                    <div class="score-label">Resume match</div>
                </div>
                <div class="score-block">
                    <div class="score-n num" style="${c.conversation_score == null ? "color:var(--color-neutral-400);" : ""}">${c.conversation_score != null ? c.conversation_score : "—"}</div>
                    <div class="score-label">Assessment</div>
                </div>
                <div style="margin-left:auto;"><span class="tag ${meta.tag}">${meta.label}</span></div>
            </div>

            <hr class="hr">

            <div class="kick" style="margin-bottom:9px;">Matched — ${(c.ats_matched_skills || []).length} of ${(c.ats_matched_skills || []).length + (c.ats_missing_skills || []).length}</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;">${skillTags(c.ats_matched_skills, "tag-outline")}</div>
            <div class="kick" style="margin:18px 0 9px;color:var(--color-neutral-600);">Missing</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;">${skillTags(c.ats_missing_skills, "tag-neutral")}</div>

            <hr class="hr">

            <div class="kick" style="margin-bottom:9px;">Summary</div>
            <p style="font-size:13.5px;line-height:1.7;text-align:justify;">${summary}</p>

            <div class="rec-box">
                <div class="kick" style="margin-bottom:5px;">Recommendation</div>
                <div class="rec-title">${rec.title}</div>
                <div class="rec-why">${rec.why}</div>
            </div>

            ${c.status === "interview_audio_uploaded" ? `
                <div style="margin-top:16px;">
                    <button class="btn btn-primary btn-block" id="btn-evaluate">Evaluate assessment</button>
                    <div class="result" id="eval-result"></div>
                </div>
            ` : ""}

            <hr class="hr">
            <div class="kick" style="margin-bottom:12px;">Decision trail</div>
            ${trail.map((t) => `
                <div class="trail-row">
                    <div class="trail-time num">${t.time}</div>
                    <div class="trail-body">
                        <div class="trail-label">${t.label}</div>
                        <div class="trail-detail">${t.detail}</div>
                        <div class="trail-by ${t.by === "Candidate" ? "candidate" : "automatic"}">${t.by}</div>
                    </div>
                </div>
            `).join("")}
        `;

        const evalBtn = document.getElementById("btn-evaluate");
        if (evalBtn) evalBtn.addEventListener("click", () => evaluateCandidate(c.candidate_id));
    }

    async function evaluateCandidate(candidateId) {
        const resultEl = document.getElementById("eval-result");
        resultEl.innerHTML = '<div class="spinner">Evaluating answers (this can take a minute)...</div>';

        const res = await fetch(`/evaluate-interview/${candidateId}`, { method: "POST" });
        const data = await res.json();
        if (!res.ok) {
            resultEl.innerHTML = `<div class="error">${data.error}</div>`;
            showToast(data.error || "Evaluation failed.", "error");
            return;
        }

        const advanced = data.status === "advanced";
        showToast(advanced ? "Candidate advanced!" : "Candidate rejected.", advanced ? "success" : "info");
        await loadCandidates(selectedJobId);
    }

    // ---------- Publish role dialog ----------

    function openPublishModal(prefill) {
        prefill = prefill || {};
        document.getElementById("publish-modal-mount").innerHTML = `
            <div class="dialog-backdrop" id="publish-backdrop">
                <div class="dialog fade-in">
                    <div class="dialog-title">Publish a role</div>
                    <div class="dialog-body">The description is reformatted into sections for the candidate-facing page, then a shareable application link is issued.</div>
                    <div class="field"><label>Role title</label><input class="input" id="job-title" placeholder="e.g. Data Analyst"></div>
                    <div class="field"><label>Description</label><textarea class="input" id="job-description" placeholder="Paste the job description…"></textarea></div>
                    <div class="result" id="publish-result"></div>
                    <div class="dialog-actions">
                        <button class="btn btn-secondary" id="btn-cancel-publish">Cancel</button>
                        <button class="btn btn-primary" id="btn-publish">Publish &amp; get link</button>
                    </div>
                </div>
            </div>
        `;
        document.getElementById("job-title").value = prefill.title || "";
        document.getElementById("job-description").value = prefill.description || "";
        document.getElementById("publish-backdrop").addEventListener("click", (e) => {
            if (e.target.id === "publish-backdrop") closePublishModal();
        });
        document.getElementById("btn-cancel-publish").addEventListener("click", closePublishModal);
        document.getElementById("btn-publish").addEventListener("click", submitPublish);
    }

    function closePublishModal() {
        document.getElementById("publish-modal-mount").innerHTML = "";
    }

    async function submitPublish() {
        const title = document.getElementById("job-title").value.trim();
        const description = document.getElementById("job-description").value.trim();
        const resultEl = document.getElementById("publish-result");
        if (!title || !description) {
            resultEl.innerHTML = '<div class="error">Enter a title and description first.</div>';
            return;
        }
        resultEl.innerHTML = '<div class="spinner">Publishing...</div>';

        const res = await fetch("/jobs", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ title, description }),
        });
        const data = await res.json();
        if (!res.ok) {
            resultEl.innerHTML = `<div class="error">${data.error}</div>`;
            showToast(data.error || "Failed to publish role.", "error");
            return;
        }

        showToast("Role published!", "success");
        closePublishModal();
        selectedJobId = data.job_id;
        loadJobs();
    }

    document.getElementById("btn-open-publish").addEventListener("click", () => openPublishModal());
    document.getElementById("btn-open-publish-2").addEventListener("click", () => openPublishModal());

    // ---------- Describe a project -> team plan ----------

    function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str == null ? "" : String(str);
        return div.innerHTML;
    }

    let teamPlanRoles = [];
    let teamPlanResults = [];
    let teamPlanStreaming = false;

    function openTeamPlanModal() {
        teamPlanRoles = [];
        teamPlanResults = [];
        teamPlanStreaming = false;
        document.getElementById("team-plan-modal-mount").innerHTML = `
            <div class="dialog-backdrop" id="team-plan-backdrop">
                <div class="dialog fade-in" style="width:min(720px,100%);max-height:85vh;overflow-y:auto;">
                    <div class="dialog-title">Describe a project</div>
                    <div class="dialog-body">Describe what you're building in plain language. AI works out which roles the project actually needs and drafts a reviewed job description for each one — review and publish the ones you want.</div>
                    <div class="field"><label>Project description</label><textarea class="input" id="project-description" placeholder="e.g. We're building a mobile app that lets users…" style="min-height:120px;"></textarea></div>
                    <div class="field"><label>Max revisions per role</label><input class="input" id="max-revisions" type="number" min="0" max="5" value="2" style="max-width:100px;"></div>
                    <div id="team-plan-result"></div>
                    <div class="dialog-actions">
                        <button class="btn btn-secondary" id="btn-cancel-team-plan">Close</button>
                        <button class="btn btn-primary" id="btn-generate-team">Generate team</button>
                    </div>
                </div>
            </div>
        `;
        document.getElementById("team-plan-backdrop").addEventListener("click", (e) => {
            if (e.target.id === "team-plan-backdrop" && !teamPlanStreaming) closeTeamPlanModal();
        });
        document.getElementById("btn-cancel-team-plan").addEventListener("click", () => {
            if (!teamPlanStreaming) closeTeamPlanModal();
        });
        document.getElementById("btn-generate-team").addEventListener("click", submitTeamPlan);
    }

    function closeTeamPlanModal() {
        document.getElementById("team-plan-modal-mount").innerHTML = "";
    }

    function teamPlanRoleCardHtml(index) {
        const role = teamPlanRoles[index];
        const finalized = teamPlanResults.find((r) => r.roleIndex === index);
        const countPrefix = role.count > 1 ? `${role.count}x · ` : "";
        if (finalized) {
            const jd = finalized.jd || {};
            return `
                <div class="card" style="margin-top:10px;">
                    <div class="card-kicker">${countPrefix}Ready</div>
                    <div class="card-title">${escapeHtml(jd.title || role.title)}</div>
                    <p class="card-body">${escapeHtml(jd.about_the_role || role.rationale)}</p>
                    <button class="btn btn-secondary" style="align-self:flex-start;" data-use-role="${index}">Use this role</button>
                </div>
            `;
        }
        return `
            <div class="card" style="margin-top:10px;">
                <div class="card-kicker">${countPrefix}Drafting…</div>
                <div class="card-title">${escapeHtml(role.title)}</div>
                <p class="card-body">${escapeHtml(role.rationale)}</p>
            </div>
        `;
    }

    function wireUseRoleButtons(container) {
        container.querySelectorAll("[data-use-role]").forEach((btn) => {
            btn.addEventListener("click", () => useGeneratedRole(parseInt(btn.dataset.useRole, 10)));
        });
    }

    function renderTeamPlanProgress(statusText) {
        const resultEl = document.getElementById("team-plan-result");
        if (!resultEl) return;
        const cards = teamPlanRoles.map((_, i) => teamPlanRoleCardHtml(i)).join("");
        resultEl.innerHTML = `<div class="spinner">${escapeHtml(statusText)}</div>${cards}`;
        wireUseRoleButtons(resultEl);
    }

    async function submitTeamPlan() {
        const projectDescription = document.getElementById("project-description").value.trim();
        const maxRevisions = document.getElementById("max-revisions").value;
        const resultEl = document.getElementById("team-plan-result");
        if (!projectDescription) {
            resultEl.innerHTML = '<div class="error">Describe the project first.</div>';
            return;
        }

        teamPlanStreaming = true;
        teamPlanRoles = [];
        teamPlanResults = [];
        document.getElementById("btn-generate-team").disabled = true;
        document.getElementById("btn-cancel-team-plan").disabled = true;
        resultEl.innerHTML = '<div class="spinner">Planning the team…</div>';

        try {
            const res = await fetch("/jobs/generate-team", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ project_description: projectDescription, max_revisions: maxRevisions }),
            });
            if (!res.ok || !res.body) {
                const data = await res.json().catch(() => ({}));
                resultEl.innerHTML = `<div class="error">${escapeHtml(data.error || "Failed to start generation.")}</div>`;
                showToast(data.error || "Failed to start generation.", "error");
                return;
            }

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const parts = buffer.split("\n\n");
                buffer = parts.pop();
                for (const part of parts) {
                    const line = part.split("\n").find((l) => l.startsWith("data: "));
                    if (!line) continue;
                    handleTeamPlanEvent(JSON.parse(line.slice(6)));
                }
            }
        } catch (e) {
            resultEl.innerHTML = '<div class="error">Something went wrong while generating the team.</div>';
            showToast("Team generation failed.", "error");
        } finally {
            teamPlanStreaming = false;
            document.getElementById("btn-generate-team").disabled = false;
            document.getElementById("btn-cancel-team-plan").disabled = false;
        }
    }

    function handleTeamPlanEvent(event) {
        if (event.type === "team_planned") {
            teamPlanRoles = event.roles;
            const count = event.roles.length;
            renderTeamPlanProgress(`Team planned — ${count} role${count === 1 ? "" : "s"}. Drafting job descriptions…`);
        } else if (event.type === "role_start") {
            renderTeamPlanProgress(`Drafting role ${event.role_index + 1} of ${teamPlanRoles.length}: ${event.role.title}…`);
        } else if (event.type === "review_ready" && !event.approved) {
            const role = teamPlanRoles[event.role_index];
            renderTeamPlanProgress(`Revising role ${event.role_index + 1} of ${teamPlanRoles.length}: ${role ? role.title : ""}…`);
        } else if (event.type === "role_finalized") {
            teamPlanResults.push({ roleIndex: event.role_index, role: event.role, jd: event.jd });
            renderTeamPlanProgress(`${teamPlanResults.length} of ${teamPlanRoles.length} role${teamPlanRoles.length === 1 ? "" : "s"} ready…`);
        } else if (event.type === "done") {
            const resultEl = document.getElementById("team-plan-result");
            const cards = teamPlanRoles.map((_, i) => teamPlanRoleCardHtml(i)).join("");
            resultEl.innerHTML = `<p class="card-body" style="margin-top:4px;">Done. Review each role below, then publish the ones you want.</p>${cards}`;
            wireUseRoleButtons(resultEl);
        } else if (event.type === "error") {
            document.getElementById("team-plan-result").innerHTML = `<div class="error">${escapeHtml(event.message)}</div>`;
            showToast("Team generation failed.", "error");
        }
    }

    function useGeneratedRole(index) {
        const finalized = teamPlanResults.find((r) => r.roleIndex === index);
        if (!finalized) return;
        const jd = finalized.jd || {};
        const sections = [];
        if (jd.about_the_role) sections.push(jd.about_the_role);
        if (jd.responsibilities && jd.responsibilities.length) {
            sections.push("Responsibilities:\n" + jd.responsibilities.map((r) => `- ${r}`).join("\n"));
        }
        if (jd.required_skills && jd.required_skills.length) {
            sections.push("Required skills:\n" + jd.required_skills.map((s) => `- ${s}`).join("\n"));
        }
        if (jd.preferred_skills && jd.preferred_skills.length) {
            sections.push("Preferred skills:\n" + jd.preferred_skills.map((s) => `- ${s}`).join("\n"));
        }
        closeTeamPlanModal();
        openPublishModal({ title: jd.title || finalized.role.title, description: sections.join("\n\n") });
    }

    document.getElementById("btn-open-team-plan").addEventListener("click", openTeamPlanModal);

    // ---------- First-time welcome ----------

    function maybeShowWelcomeModal() {
        let seen = false;
        try {
            seen = localStorage.getItem("autohire_welcome_seen") === "1";
        } catch (e) {
            return; // storage unavailable — skip rather than risk showing it every time
        }
        if (seen) return;

        document.getElementById("welcome-modal-mount").innerHTML = `
            <div class="dialog-backdrop" id="welcome-backdrop">
                <div class="dialog fade-in">
                    <div class="dialog-title">Welcome to AutoHire</div>
                    <div class="dialog-body">
                        Three steps, no manual screening:
                        <br><br>
                        <strong>1. Publish a role</strong> — write a title and description, get a shareable application link.
                        <br><br>
                        <strong>2. Candidates apply</strong> — they upload just a resume. AI parses it, scores it against the role, and shortlisted candidates are emailed a link to a short recorded assessment automatically.
                        <br><br>
                        <strong>3. You review</strong> — come back here to see scores, listen to what candidates said, and see who advanced.
                    </div>
                    <div class="dialog-actions">
                        <button class="btn btn-secondary" id="btn-welcome-skip">Skip</button>
                        <button class="btn btn-primary" id="btn-welcome-done">Show me around</button>
                    </div>
                </div>
            </div>
        `;
        document.getElementById("btn-welcome-skip").addEventListener("click", () => closeWelcomeModal());
        document.getElementById("btn-welcome-done").addEventListener("click", () => {
            closeWelcomeModal();
            startTour();
        });
    }

    function closeWelcomeModal() {
        document.getElementById("welcome-modal-mount").innerHTML = "";
        try {
            localStorage.setItem("autohire_welcome_seen", "1");
        } catch (e) {
            // ignore — worst case the modal reappears next visit
        }
    }

    // ---------- Guided tour ----------

    const TOUR_STEPS = [
        {
            target: "#btn-open-publish",
            title: "1. Publish a role",
            text: "Start here. Click this to open the publish form.",
            before: () => closePublishModal(),
        },
        {
            target: "#job-title",
            title: "2. Enter role title",
            text: "Enter the role name here — e.g. \"Data Analyst\".",
            before: () => openPublishModal(),
        },
        {
            target: "#job-description",
            title: "3. Enter job description",
            text: "Paste the full job description here. AutoHire reformats it into clean sections for candidates automatically.",
        },
        {
            target: "#btn-publish",
            title: "4. Publish it",
            text: "Click here to publish. You'll get a shareable application link right away.",
        },
        {
            target: "#roles-list",
            title: "5. Share the link and wait",
            text: "Copy that link and send it to candidates — no account needed on their end. Once someone applies, they show up right here in this list with their score.",
            before: () => closePublishModal(),
        },
        {
            target: "#main-col",
            title: "6. Evaluate the interview",
            text: "Once a candidate finishes their recorded assessment, an Evaluate button appears next to them in this table. Click it to score their answers and see the final decision.",
        },
    ];

    let tourStepIndex = 0;

    function startTour() {
        tourStepIndex = 0;
        runTourStep();
    }

    function runTourStep() {
        document.querySelectorAll(".tour-spotlight").forEach((el) => el.classList.remove("tour-spotlight"));

        if (tourStepIndex >= TOUR_STEPS.length) {
            endTour();
            return;
        }

        const step = TOUR_STEPS[tourStepIndex];
        if (step.before) step.before();

        const target = document.querySelector(step.target);
        if (!target) {
            tourStepIndex += 1;
            runTourStep();
            return;
        }

        target.scrollIntoView({ behavior: "smooth", block: "center" });
        target.classList.add("tour-spotlight");

        // give scrollIntoView a moment to settle before measuring position
        setTimeout(() => positionTourCallout(target, step), 120);
    }

    function positionTourCallout(target, step) {
        const rect = target.getBoundingClientRect();
        const calloutWidth = 280;
        const estimatedHeight = 170;
        const margin = 14;
        const viewportPad = 12;

        // A target inside the publish dialog (title/description fields, the
        // publish button) must never be covered by the callout — the whole
        // point is to let the user actually click into and fill those fields.
        // Anchor to the dialog's own box and place the callout beside it
        // instead of directly above/below the specific field.
        const dialog = target.closest(".dialog");
        let top, left, showArrow = false, placement = "below", arrowLeft = 0;

        if (dialog) {
            const dRect = dialog.getBoundingClientRect();
            const roomRight = window.innerWidth - dRect.right;
            const roomLeft = dRect.left;
            const onRight = roomRight >= calloutWidth + margin + viewportPad || roomRight >= roomLeft;

            left = onRight ? dRect.right + margin : dRect.left - margin - calloutWidth;
            left = Math.min(Math.max(left, viewportPad), window.innerWidth - calloutWidth - viewportPad);

            top = rect.top + rect.height / 2 - estimatedHeight / 2;
            top = Math.min(Math.max(top, viewportPad), window.innerHeight - estimatedHeight - viewportPad);
        } else {
            // Prefer just below the target, then just above it — but always clamp
            // fully inside the viewport so a very tall target (e.g. a whole column)
            // can never push the callout off-screen.
            let naturalTop = rect.bottom + margin;
            if (naturalTop + estimatedHeight > window.innerHeight - viewportPad) {
                placement = "above";
                naturalTop = rect.top - margin - estimatedHeight;
            }
            top = Math.min(
                Math.max(naturalTop, viewportPad),
                window.innerHeight - estimatedHeight - viewportPad
            );
            showArrow = top === naturalTop;

            left = rect.left + rect.width / 2 - calloutWidth / 2;
            left = Math.min(Math.max(left, viewportPad), window.innerWidth - calloutWidth - viewportPad);
            arrowLeft = Math.min(Math.max(rect.left + rect.width / 2 - left - 6, 12), calloutWidth - 24);
        }

        const isLast = tourStepIndex === TOUR_STEPS.length - 1;

        document.getElementById("tour-overlay-mount").innerHTML = `
            <div class="tour-callout fade-in" style="top:${top}px; left:${left}px;">
                ${showArrow ? `<div class="tour-arrow" style="
                    ${placement === "below" ? "top:-6px;" : "bottom:-6px;"}
                    left:${arrowLeft}px;"></div>` : ""}
                <div class="tour-callout-title">${step.title}</div>
                <div class="tour-callout-text">${step.text}</div>
                <div class="tour-callout-actions">
                    <span class="tour-step-count">${tourStepIndex + 1} of ${TOUR_STEPS.length}</span>
                    <div style="display:flex;gap:6px;">
                        <button class="btn btn-secondary" style="padding:5px 10px;font-size:12px;" id="tour-skip">Skip tour</button>
                        <button class="btn btn-primary" style="padding:5px 10px;font-size:12px;" id="tour-next">${isLast ? "Done" : "Next"}</button>
                    </div>
                </div>
            </div>
        `;
        document.getElementById("tour-next").addEventListener("click", () => {
            tourStepIndex += 1;
            runTourStep();
        });
        document.getElementById("tour-skip").addEventListener("click", endTour);
    }

    function endTour() {
        document.querySelectorAll(".tour-spotlight").forEach((el) => el.classList.remove("tour-spotlight"));
        document.getElementById("tour-overlay-mount").innerHTML = "";
        closePublishModal();
    }

    document.getElementById("btn-take-tour").addEventListener("click", (e) => {
        e.preventDefault();
        startTour();
    });

    maybeShowWelcomeModal();
    loadJobs();
</script>
