name: Deploy to Cloud Run

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1090038135673/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@autohr-501816.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy autohire \
            --source . \
            --region us-central1 \
            --project autohr-501816 \
            --quiet
